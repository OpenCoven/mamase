<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mamase-runtime" content="local" />
    <meta name="description" content="The Coven's local-first workspace for model distillation, LoRA training, and honest experiment tracking." />
    <title>Mamasé · Coven Distillation Lab</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script src="./theme.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Mamasé requires JavaScript to manage your local training workspace.</noscript>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <!-- Both regions stay in the document, empty, at a fixed politeness: a live region announces a change to content it already exposes, not content it appears with. -->
    <div id="toast" class="toast"><div id="toast-status" role="status" aria-live="polite"></div><div id="toast-alert" class="error" role="alert" aria-live="assertive"></div></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
